<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Authentication</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Poppins font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
        <!-- Phosphor -->
        <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/index.min.js"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.min.css"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/auth.css" />
        <script type="module" src="js/auth.js"></script>
    </head>
    <body>
        <div class="center">
            <div class="container">
                <div class="intro">
                    <h2 id="auth-title">Welcome back.</h2>
                    <h3>The distraction-free workspace for builders.</h3>
                </div>
                <div class="options">
                    <div class="switch">
                        <button type="button" id="log" class="active">Sign In</button>
                        <button type="button" id="reg">Create Account</button>
                    </div>
                    <div class="auth-options">
                        <button type="button" id="github-btn">
                            <img
                                src="img/github.svg"
                                role="img"
                                class="icons"
                                alt="github icon"
                            />Github
                        </button>
                        <button type="button" id="google-btn">
                            <img
                                src="img/google.svg"
                                role="img"
                                class="icons"
                                alt="google icon"
                            />Google
                        </button>
                    </div>
                </div>
                <div class="divider">
                    <span class="divider-text">OR CONTINUE WITH EMAIL</span>
                </div>
                <form class="auth-form" id="auth-form" action="#">
                    <!-- Username -->
                    <label id="username-label" for="Username">Username</label>
                    <div id="username-field" class="auth-input">
                        <i class="ph ph-user"></i>
                        <input id="username" type="text" placeholder="Username" autocomplete="username" />
                    </div>
                    <!-- Email -->
                    <label for="email">Email</label>
                    <div class="auth-input">
                        <i class="ph ph-envelope-simple"></i>
                        <input id="email" type="email" placeholder="name@company.com" autocomplete="email" />
                    </div>
                    <!-- Password -->
                    <div class="password-guide">
                        <label for="pass">Password</label>
                        <a href="#" class="forgot-pass" id="forgot-pass">Forgot Password?</a>
                    </div>
                    <div class="auth-input">
                        <i class="ph ph-lock"></i>
                        <input type="password" id="pass" placeholder="••••••••••••" autocomplete="current-password" />
                        <i class="ph ph-eye" id="toggle-pass"></i>
                    </div>

                    <div id="auth-message" class="auth-message" role="alert"></div>
                    <button class="btn" type="submit" id="submit-btn">
                        <span id="submit-text">Sign in</span>
                        <i class="ph ph-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
