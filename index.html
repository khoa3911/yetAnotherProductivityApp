<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Kanban</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
        <link rel="stylesheet" href="css/dashboard.css" />
    </head>
    <body>
        <div class="app">
            <aside class="side" id="side">
                <div class="logo">
                    <button
                        class="logo-btn"
                        data-toggle-sidebar
                        aria-label="Toggle sidebar"
                        aria-controls="side"
                        aria-expanded="true"
                    >
                        <i><b></b><b></b><b></b></i>
                    </button>
                    <span id="username"></span>
                </div>
                <div class="navs">
                    <h2 id="boardCount"></h2>
                    <nav class="nav" id="nav" aria-label="Boards"></nav>
                    <h2 id="listCount"></h2>
                    <nav class="nav" id="listNav" aria-label="Todo lists"></nav>
                </div>
                <div class="theme">
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            d="M6.5 1a7 7 0 1 0 8.5 8.5A5.5 5.5 0 0 1 6.5 1z"
                        />
                    </svg>
                    <button
                        class="switch"
                        id="themeBtn"
                        aria-label="Toggle light and dark theme"
                    ></button>
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <circle cx="8" cy="8" r="3" />
                        <path
                            d="M8 0v2.5M8 13.5V16M0 8h2.5M13.5 8H16M2.3 2.3l1.8 1.8M11.9 11.9l1.8 1.8M2.3 13.7l1.8-1.8M11.9 4.1l1.8-1.8"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                        />
                    </svg>
                </div>
            </aside>
            <button
                class="scrim"
                data-toggle-sidebar
                aria-label="Close sidebar"
                tabindex="-1"
            ></button>
            <div class="main">
                <header class="top">
                    <div class="top-title">
                        <button
                            class="logo-btn top-logo"
                            data-toggle-sidebar
                            aria-label="Open sidebar"
                            aria-controls="side"
                            aria-expanded="false"
                        >
                            <i><b></b><b></b><b></b></i>
                        </button>
                        <h1 id="title"></h1>
                    </div>
                    <div class="top-actions">
                        <button class="add" id="addTask">+ Add new task</button>
                        <div class="menu-wrap" id="boardMenuWrap">
                            <button
                                class="more"
                                id="boardMenuBtn"
                                aria-label="Board options"
                                aria-haspopup="menu"
                                aria-expanded="false"
                            >
                                ⋮
                            </button>
                            <div class="menu" id="boardMenu" role="menu" hidden>
                                <button role="menuitem" id="renameBoard">
                                    Rename board
                                </button>
                                <button
                                    role="menuitem"
                                    class="danger"
                                    id="deleteBoard"
                                >
                                    Delete board
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
                <section class="board" id="board" aria-live="polite"></section>
            </div>
        </div>
        <aside
            class="detail"
            id="detail"
            hidden
            aria-label="Task details"
        ></aside>
        <script type="module" src="js/dashboard.js"></script>
    </body>
</html>
